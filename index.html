<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Treino Alysson — Registro & Alternativas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116; --surface:#171b22; --surface-2:#1e232c;
    --line:#272d38; --line-soft:#20252e;
    --txt:#e8ecf2; --txt-dim:#9aa4b2; --txt-faint:#616b7a;
    --acc:#22d3ee; --radius:16px;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35);
  }
  [data-treino="A"]{ --acc:#22d3ee; }
  [data-treino="B"]{ --acc:#fbbf24; }
  [data-treino="C"]{ --acc:#a78bfa; }

  *{box-sizing:border-box} html,body{margin:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, rgba(255,255,255,.04), transparent 60%),var(--bg);
    color:var(--txt); font-family:"Barlow",system-ui,sans-serif; font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased; padding-bottom:64px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 18px}

  header.hero{padding:30px 0 18px;border-bottom:1px solid var(--line-soft);margin-bottom:16px}
  .eyebrow{font-family:"Barlow Semi Condensed";font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:.72rem;color:var(--acc);transition:color .35s}
  h1{font-family:"Barlow Semi Condensed";font-weight:800;font-size:clamp(2rem,7vw,2.9rem);line-height:1.02;letter-spacing:-.01em;margin:.28em 0 .18em}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .badge{font-family:"Barlow Semi Condensed";font-weight:600;letter-spacing:.04em;font-size:.78rem;text-transform:uppercase;color:var(--txt-dim);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:100px}

  .sync{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px}
  .sync .g-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1f1f1f;border:none;border-radius:9px;padding:8px 13px;cursor:pointer;font-family:"Barlow",sans-serif;font-weight:600;font-size:.88rem}
  .sync .g-btn:hover{background:#f2f2f2}
  .sync .g-btn:disabled{opacity:.5;cursor:not-allowed}
  .sync .status{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;color:var(--txt-dim);font-weight:500}
  .sync .status .dot{width:8px;height:8px;border-radius:50%;background:var(--txt-faint);flex:none}
  .sync .status.local .dot{background:#8b93a1}
  .sync .status.synced .dot{background:#3ddc84}
  .sync .status.syncing .dot{background:var(--acc);animation:pulse 1s infinite}
  .sync .status.error .dot{background:#ff6b6b}
  .sync .signout{margin-left:auto;appearance:none;background:transparent;border:none;color:var(--txt-faint);text-decoration:underline;cursor:pointer;font-size:.8rem;font-family:inherit}
  @keyframes pulse{50%{opacity:.35}}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 72%,transparent);padding:10px 0 12px}
  .tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--txt-dim);border-radius:14px;padding:11px 6px 10px;cursor:pointer;text-align:center;transition:.18s;display:flex;flex-direction:column;gap:2px;align-items:center}
  .tab .t-letter{font-family:"Barlow Semi Condensed";font-weight:800;font-size:1.35rem;line-height:1}
  .tab .t-focus{font-family:"Barlow Semi Condensed";font-weight:600;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
  .tab[aria-selected="true"]{color:var(--tab-acc);border-color:color-mix(in srgb,var(--tab-acc) 55%,transparent);background:color-mix(in srgb,var(--tab-acc) 12%,var(--surface));box-shadow:0 0 0 1px color-mix(in srgb,var(--tab-acc) 30%,transparent) inset}
  .tab:focus-visible{outline:2px solid var(--tab-acc);outline-offset:2px}
  .tab[data-t="A"]{--tab-acc:#22d3ee}.tab[data-t="B"]{--tab-acc:#fbbf24}.tab[data-t="C"]{--tab-acc:#a78bfa}

  .session{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
  .session .count{font-family:"Barlow Semi Condensed";font-weight:800;font-size:1.5rem;line-height:1;color:var(--acc);transition:color .35s;white-space:nowrap}
  .session .count small{color:var(--txt-faint);font-weight:600}
  .session .bar-outer{flex:1;height:8px;border-radius:100px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
  .session .bar-inner{height:100%;width:0;border-radius:100px;background:var(--acc);transition:width .4s cubic-bezier(.2,.8,.2,1),background .35s}
  .session button.reset{appearance:none;background:transparent;border:1px solid var(--line);color:var(--txt-dim);border-radius:10px;padding:7px 12px;cursor:pointer;font-family:"Barlow Semi Condensed";font-weight:600;font-size:.82rem;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;transition:.16s}
  .session button.reset:hover{color:var(--txt);border-color:var(--acc)}

  .list{display:flex;flex-direction:column;gap:14px}
  .ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s}
  .ex.done{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
  .ex-head{display:flex;gap:14px;padding:16px 16px 12px;align-items:flex-start}
  .ord{font-family:"Barlow Semi Condensed";font-weight:800;font-size:2.5rem;line-height:.85;-webkit-text-stroke:1.5px color-mix(in srgb,var(--acc) 70%,transparent);color:transparent;flex:none;min-width:1.4em;transition:-webkit-text-stroke-color .35s;font-variant-numeric:tabular-nums}
  .ex.done .ord{-webkit-text-stroke:0;color:color-mix(in srgb,var(--acc) 85%,white)}
  .ex-title{flex:1;min-width:0}
  .ex-name{font-family:"Barlow Semi Condensed";font-weight:700;font-size:1.18rem;line-height:1.1;letter-spacing:-.005em;margin:0}
  .ex-target{font-size:.82rem;color:var(--txt-faint);margin-top:2px;font-weight:500}
  .head-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;flex:none}
  .play{display:inline-flex;align-items:center;gap:5px;font-family:"Barlow Semi Condensed";font-weight:700;font-size:.78rem;letter-spacing:.03em;text-transform:uppercase;color:var(--acc);text-decoration:none;border:1px solid color-mix(in srgb,var(--acc) 40%,var(--line));background:color-mix(in srgb,var(--acc) 8%,transparent);padding:5px 9px;border-radius:8px;transition:.16s;white-space:nowrap}
  .play:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
  .play svg{width:13px;height:13px}
  .check{flex:none;width:30px;height:30px;border-radius:9px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center;transition:.16s}
  .check svg{width:16px;height:16px;stroke:var(--bg);opacity:0;transform:scale(.6);transition:.16s}
  .check[aria-pressed="true"]{background:var(--acc);border-color:var(--acc)}
  .check[aria-pressed="true"] svg{opacity:1;transform:scale(1)}
  .check:focus-visible,.play:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

  .fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px 10px}
  @media(max-width:540px){.fields{grid-template-columns:repeat(2,1fr)}}
  .field{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:7px 10px 6px;transition:border-color .16s}
  .field:focus-within{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
  .field .k{font-family:"Barlow Semi Condensed";font-weight:600;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-faint)}
  .field input{background:transparent;border:none;color:var(--txt);font-family:"Barlow Semi Condensed";font-weight:700;font-size:1rem;padding:1px 0;width:100%;font-variant-numeric:tabular-nums}
  .field input:focus{outline:none}

  .linkfield{display:flex;align-items:center;gap:9px;margin:0 16px 12px;padding:8px 11px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px}
  .linkfield .k{font-family:"Barlow Semi Condensed";font-weight:600;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-faint);white-space:nowrap}
  .linkfield input{flex:1;min-width:0;background:transparent;border:none;color:var(--txt-dim);font-family:"Barlow",monospace;font-size:.78rem;padding:2px 0}
  .linkfield input:focus{outline:none;color:var(--txt)}

  .alt-toggle{width:100%;appearance:none;cursor:pointer;text-align:left;background:transparent;border:none;border-top:1px solid var(--line-soft);color:var(--txt-dim);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:"Barlow Semi Condensed";font-weight:600;font-size:.86rem;letter-spacing:.04em;text-transform:uppercase;transition:.16s}
  .alt-toggle:hover{color:var(--txt)}
  .alt-toggle:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
  .alt-toggle .caret{transition:transform .22s;color:var(--acc)}
  .ex.open .alt-toggle .caret{transform:rotate(180deg)}
  .alt-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s;background:color-mix(in srgb,var(--acc) 4%,var(--bg))}
  .ex.open .alt-panel{grid-template-rows:1fr}
  .alt-inner{overflow:hidden}
  .alt-list{list-style:none;margin:0;padding:4px 16px 16px}
  .alt-list li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
  .alt-list li:last-child{border-bottom:none}
  .alt-dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:8px;background:var(--acc)}
  .alt-body{flex:1;min-width:0}
  .alt-name{font-family:"Barlow Semi Condensed";font-weight:700;font-size:1rem;color:var(--txt);line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .alt-name:hover{color:var(--acc)}
  .alt-name svg{width:12px;height:12px;color:var(--acc);flex:none}
  .alt-why{font-size:.85rem;color:var(--txt-dim);margin-top:1px}

  footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--line-soft);color:var(--txt-faint);font-size:.8rem;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
  footer button.clear{appearance:none;background:transparent;border:none;color:var(--txt-faint);text-decoration:underline;cursor:pointer;font-size:.8rem;font-family:inherit}
  footer button.clear:hover{color:var(--txt-dim)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-treino="A">
  <div class="wrap">
    <header class="hero">
      <div class="eyebrow">Rotina · Hipertrofia</div>
      <h1>Treino Alysson</h1>
      <div class="badges">
        <span class="badge">Iniciante</span>
        <span class="badge" id="badge-focus">Costas + Bíceps</span>
      </div>
    </header>

    <div class="sync">
      <button class="g-btn" id="g-signin">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.3 13.3 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.5z"/><path fill="#FBBC05" d="M10.5 28.3c-.5-1.4-.7-2.9-.7-4.3s.3-3 .7-4.3l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.4l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.7l-7.1-5.5c-2 1.3-4.6 2.1-8.5 2.1-6.4 0-11.7-3.8-13.5-9.3l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Entrar com Google
      </button>
      <span class="status local" id="sync-status"><span class="dot"></span>Salvo neste dispositivo</span>
      <button class="signout" id="g-signout" hidden>Sair</button>
    </div>

    <nav class="tabs" role="tablist" aria-label="Escolher treino">
      <button class="tab" role="tab" data-t="A" aria-selected="true"><span class="t-letter">A</span><span class="t-focus">Costas</span></button>
      <button class="tab" role="tab" data-t="B" aria-selected="false"><span class="t-letter">B</span><span class="t-focus">Peito</span></button>
      <button class="tab" role="tab" data-t="C" aria-selected="false"><span class="t-letter">C</span><span class="t-focus">Inferiores</span></button>
    </nav>

    <div class="session">
      <div class="count"><span id="sess-done">0</span><small>/<span id="sess-total">7</span> feitos</small></div>
      <div class="bar-outer"><div class="bar-inner" id="sess-bar"></div></div>
      <button class="reset" id="reset-btn">Zerar sessão</button>
    </div>

    <main class="list" id="list"></main>

    <footer>
      <span>Campos editáveis · sincroniza com o Google Drive quando você entra</span>
      <button class="clear" id="clear-all">Restaurar plano original</button>
    </footer>
  </div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ==========================================================================
   CONFIGURAÇÃO — cole aqui o Client ID OAuth (pode ser o mesmo do Caderno de
   Poesia; o origin https://alyamorim.github.io já está autorizado lá).
   ========================================================================== */
const CLIENT_ID = "COLE_AQUI_SEU_CLIENT_ID.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const FILE_NAME = "treinos-alysson.json";

/* ==================== DADOS BASE ==================== */
const yt = n => "https://www.youtube.com/results?search_query=" + encodeURIComponent(n + " execução correta");
function mk(name,target,series,reps,carga,intervalo,alts){
  return {name,target,base:{series,reps,carga,intervalo,link:yt(name)},alts};
}
const TREINOS = {
  A:{focus:"Costas + Bíceps",ex:[
    mk("Abdominal Supra Solo","Abdômen (reto)","3","12","Peso corporal","45s",[
      ["Abdominal na máquina","Mesma flexão de tronco, com carga fácil de progredir."],
      ["Crunch na polia alta (ajoelhado)","Resistência constante e ajuste fino de carga."],
      ["Elevação de pernas suspenso","Desloca a ênfase para a porção inferior."],
      ["Prancha isométrica","Opção sem flexionar a coluna, foco em estabilização."]]),
    mk("Remada Máquina (Pegada Neutra)","Dorsal médio","3","10–12","35 kg","45s",[
      ["Remada baixa na polia (triângulo)","Mesmo padrão e pegada neutra, com cabo."],
      ["Remada unilateral com halter (serrote)","Um lado por vez, corrige assimetrias."],
      ["Remada curvada com halteres","Versão livre, recruta mais estabilizadores."],
      ["Remada cavalinho pegada neutra","Permite subir bastante a carga."]]),
    mk("Puxada Aberta Barra Reta","Dorsais (largura)","3","10–12","16 kg","45s",[
      ["Barra fixa (assistida se precisar)","Padrão livre e ótimo estímulo para as costas."],
      ["Puxada pegada supinada","Recruta mais bíceps e a parte baixa do dorsal."],
      ["Puxada triângulo (fechada)","Foco em espessura do dorsal médio."],
      ["Pulldown de braços estendidos","Isola o dorsal sem envolver o bíceps."]]),
    mk("Remada Cavalinho (Pegada Pronada)","Dorso (espessura)","3","10–12","20 kg","15s",[
      ["Remada curvada com barra (pronada)","Livre, aceita muita carga."],
      ["Remada baixa pegada pronada aberta","Ênfase em trapézio médio e romboides."],
      ["Remada no Smith","Trajetória guiada, mais estável."],
      ["Remada T com apoio no peito","Poupa a lombar e isola o dorso."]]),
    mk("Crucifixo Inverso Máquina","Deltoide posterior","3","10–12","10 kg","45s",[
      ["Crucifixo inverso com halteres","Tronco inclinado; versão livre do movimento."],
      ["Face pull na polia","Deltoide posterior + manguito rotador."],
      ["Crucifixo inverso no cross","Tensão contínua durante toda a fase."],
      ["Elevação posterior no banco inclinado","Peito apoiado elimina o balanço."]]),
    mk("Rosca Scott Máquina","Bíceps","3","10–12","10 kg","45s",[
      ["Rosca Scott com barra W","Mesma posição de apoio, com peso livre."],
      ["Rosca concentrada","Bom pico de contração, um braço por vez."],
      ["Rosca no banco inclinado (halteres)","Alonga bem o bíceps na descida."],
      ["Rosca direta com barra","Permite mais carga total."]]),
    mk("Rosca Direta na Polia Baixa com Corda","Bíceps","3","10–12","5 kg","45s",[
      ["Rosca direta com barra reta ou W","Clássico com carga e supinação fixa."],
      ["Rosca alternada com halteres","Supinação livre, um braço de cada vez."],
      ["Rosca martelo (corda/halteres)","Pega o braquial e o antebraço."],
      ["Rosca na polia com barra reta","Tensão contínua do início ao fim."]])
  ]},
  B:{focus:"Peito + Ombro + Tríceps",ex:[
    mk("Prancha Isométrica","Core","3","40s","Isométrico","45s",[
      ["Prancha lateral","Foca os oblíquos e a estabilização lateral."],
      ["Prancha com toque no ombro","Adiciona componente anti-rotação."],
      ["Roda abdominal (ab wheel)","Progressão mais avançada do core."],
      ["Hollow hold","Controle e tensão de todo o abdômen."]]),
    mk("Crucifixo Máquina (Peck Deck)","Peitoral (adução)","3","10–12","15 kg","45s",[
      ["Crucifixo com halteres (banco reto)","Versão livre, com mais amplitude."],
      ["Crossover na polia","Tensão contínua e ângulo ajustável."],
      ["Crucifixo inclinado com halteres","Desloca a ênfase para o peito superior."],
      ["Crossover de baixo para cima","Ênfase na porção clavicular."]]),
    mk("Supino Máquina (Pegada Pronada)","Peitoral (empurrar)","3","10–12","35 kg","45s",[
      ["Supino reto com halteres","Mais amplitude e estabilizadores."],
      ["Supino reto com barra","Foco em força e carga."],
      ["Supino no Smith","Trajetória guiada, seguro sem ajudante."],
      ["Flexão de braço","Peso corporal, dá pra fazer em casa."]]),
    mk("Supino Inclinado com Halteres","Peitoral superior","3","10–12","5 kg","45s",[
      ["Supino inclinado com barra","Aceita mais carga."],
      ["Supino inclinado na máquina","Trajetória guiada e estável."],
      ["Supino inclinado no Smith","Boa opção para treinar sozinho."],
      ["Crossover de baixo para cima","Isola a porção superior do peito."]]),
    mk("Elevação Lateral Sentado com Halteres","Deltoide lateral","3","10–12","3 kg","45s",[
      ["Elevação lateral em pé","Permite leve impulso e um pouco mais de carga."],
      ["Elevação lateral na polia (unilateral)","Tensão já no começo do movimento."],
      ["Elevação lateral na máquina","Trajetória fixa, sem roubo."],
      ["Elevação lateral inclinado (lean-away)","Tensão máxima na fase de alongamento."]]),
    mk("Tríceps Testa com Halteres","Tríceps","3","10–12","6 kg","45s",[
      ["Tríceps testa com barra W","Mais estável e permite mais carga."],
      ["Tríceps francês (acima da cabeça)","Ênfase na cabeça longa do tríceps."],
      ["Tríceps na polia com corda","Tensão contínua, fácil de progredir."],
      ["Mergulho no banco (bench dips)","Peso corporal, sem equipamento."]]),
    mk("Tríceps na Polia Barra W","Tríceps","3","10–12","5 kg","45s",[
      ["Tríceps na polia com corda","Abertura no final gera bom pico."],
      ["Tríceps pegada pronada (barra reta)","Ênfase na cabeça lateral."],
      ["Mergulho nas paralelas (assistido)","Composto e com peso corporal."],
      ["Tríceps coice na polia/halter","Isolamento com pico de contração."]])
  ]},
  C:{focus:"Membros Inferiores",ex:[
    mk("Abdominal Infra com as Pernas Flexionadas","Abdômen inferior","3","15","Peso corporal","45s",[
      ["Elevação de pernas na cadeira romana","Mais estímulo para o infra."],
      ["Elevação de pernas suspenso na barra","Versão mais avançada."],
      ["Abdominal infra no banco declinado","Aumenta a amplitude."],
      ["Canivete (V-up)","Trabalha supra e infra juntos."]]),
    mk("Cadeira Extensora","Quadríceps (isolado)","3","10–12","35 kg","45s",[
      ["Agachamento livre","Composto, grande estímulo para as pernas."],
      ["Hack squat","Quadríceps com a coluna apoiada."],
      ["Leg press","Carga alta com bastante segurança."],
      ["Afundo / passada (lunge)","Unilateral, trabalha equilíbrio."]]),
    mk("Leg Press Horizontal","Quadríceps + glúteo","3","10–12","50 kg","45s",[
      ["Agachamento livre","Padrão completo de membros inferiores."],
      ["Agachamento no Smith","Guiado, bom para aprender o movimento."],
      ["Hack squat","Foco maior no quadríceps."],
      ["Leg press 45°","Só muda o ângulo de empurrar."]]),
    mk("Stiff com Halteres","Posterior de coxa + glúteo","3","10–12","3 kg","45s",[
      ["Stiff com barra","Permite mais carga."],
      ["Levantamento terra romeno (RDL)","Trabalha toda a cadeia posterior."],
      ["Mesa flexora (deitado)","Isola o posterior sem exigir a lombar."],
      ["Bom dia (good morning)","Posterior de coxa + lombar."]]),
    mk("Abdução de Quadril Máquina","Glúteo médio","3","10–12","45 kg","45s",[
      ["Abdução com elástico/caneleira","Dá pra fazer em casa."],
      ["Abdução na polia baixa (unilateral)","Tensão contínua, um lado por vez."],
      ["Coice na polia (glute kickback)","Ênfase no glúteo máximo."],
      ["Elevação pélvica (hip thrust)","Glúteo máximo com bastante carga."]]),
    mk("Panturrilha Sentado","Panturrilha (sóleo)","3","10–12","25 kg","45s",[
      ["Panturrilha em pé na máquina","Joelho estendido pega mais o gastrocnêmio."],
      ["Panturrilha no leg press","Aceita carga alta."],
      ["Panturrilha no Smith (em pé)","Guiada e estável."],
      ["Panturrilha unilateral no step","Mais amplitude e simetria."]]),
    mk("Cadeira Flexora","Posterior de coxa","3","10–12","45 kg","45s",[
      ["Mesa flexora (deitado)","Muda a posição do quadril e o estímulo."],
      ["Flexora unilateral","Corrige diferença entre as pernas."],
      ["Stiff / RDL","Versão composta, com quadril."],
      ["Flexão nórdica (nordic curl)","Excêntrico intenso, mais avançado."]])
  ]}
};

/* ==================== ESTADO ==================== */
const KEY = "treino-alysson-v2";
let state = { fields:{}, done:{} };
try{ const raw=localStorage.getItem(KEY); if(raw) state=Object.assign({fields:{},done:{}},JSON.parse(raw)); }catch(e){}
function saveLocal(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function save(){ saveLocal(); syncUp(); }

let current="A";
const $=s=>document.querySelector(s);
const list=$("#list");

function val(id,k,base){ return (state.fields[id] && state.fields[id][k]!=null) ? state.fields[id][k] : base; }
function setField(id,k,v){ (state.fields[id]=state.fields[id]||{})[k]=v; }

const caret=`<svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
const tick=`<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const playIco=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
const extIco=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

function fieldBox(id,k,label,base){
  return `<label class="field"><span class="k">${label}</span>
    <input data-id="${id}" data-k="${k}" value="${esc(val(id,k,base))}" aria-label="${label}"></label>`;
}

function render(){
  const t=TREINOS[current];
  document.body.dataset.treino=current;
  $("#badge-focus").textContent=t.focus;
  $("#sess-total").textContent=t.ex.length;

  list.innerHTML=t.ex.map((ex,i)=>{
    const id=current+(i+1), done=!!state.done[id];
    const link=val(id,"link",ex.base.link);
    const ord=String(i+1).padStart(2,"0");
    const alts=ex.alts.map(a=>`
      <li><span class="alt-dot"></span><div class="alt-body">
        <a class="alt-name" href="${yt(a[0])}" target="_blank" rel="noopener">${a[0]} ${extIco}</a>
        <div class="alt-why">${a[1]}</div>
      </div></li>`).join("");
    return `
    <article class="ex ${done?"done":""}" data-id="${id}">
      <div class="ex-head">
        <div class="ord">${ord}</div>
        <div class="ex-title"><h3 class="ex-name">${ex.name}</h3><div class="ex-target">${ex.target}</div></div>
        <div class="head-actions">
          <a class="play" data-play href="${esc(link)}" target="_blank" rel="noopener">${playIco} Execução</a>
          <button class="check" aria-pressed="${done}" aria-label="Marcar como feito" data-act="done">${tick}</button>
        </div>
      </div>
      <div class="fields">
        ${fieldBox(id,"series","Séries",ex.base.series)}
        ${fieldBox(id,"reps","Reps",ex.base.reps)}
        ${fieldBox(id,"carga","Carga",ex.base.carga)}
        ${fieldBox(id,"intervalo","Intervalo",ex.base.intervalo)}
      </div>
      <div class="linkfield">
        <span class="k">Link ▶</span>
        <input data-id="${id}" data-k="link" value="${esc(link)}" aria-label="Link de execução" spellcheck="false">
      </div>
      <button class="alt-toggle" data-act="toggle" aria-expanded="false"><span>Alternativas · ${ex.alts.length} opções</span> ${caret}</button>
      <div class="alt-panel"><div class="alt-inner"><ul class="alt-list">${alts}</ul></div></div>
    </article>`;
  }).join("");
  updateSession();
}

function updateSession(){
  const t=TREINOS[current]; let done=0;
  t.ex.forEach((_,i)=>{ if(state.done[current+(i+1)]) done++; });
  $("#sess-done").textContent=done;
  $("#sess-bar").style.width=(done/t.ex.length*100)+"%";
}

/* ==================== INTERAÇÕES ==================== */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected","false"));
    tab.setAttribute("aria-selected","true");
    current=tab.dataset.t; render(); window.scrollTo({top:0,behavior:"smooth"});
  });
});

list.addEventListener("click",e=>{
  const card=e.target.closest(".ex"); if(!card) return;
  const act=e.target.closest("[data-act]")?.dataset.act; if(!act) return;
  const id=card.dataset.id;
  if(act==="done"){
    state.done[id]=!state.done[id];
    card.classList.toggle("done",state.done[id]);
    e.target.closest(".check").setAttribute("aria-pressed",state.done[id]);
    updateSession(); save();
  }
  if(act==="toggle"){
    const open=card.classList.toggle("open");
    e.target.closest(".alt-toggle").setAttribute("aria-expanded",open);
  }
});

list.addEventListener("input",e=>{
  const el=e.target; if(!el.dataset.k) return;
  const id=el.dataset.id, k=el.dataset.k;
  setField(id,k,el.value);
  if(k==="link"){ const p=el.closest(".ex").querySelector("[data-play]"); if(p) p.href=el.value; }
  save();
});

$("#reset-btn").addEventListener("click",()=>{
  TREINOS[current].ex.forEach((_,i)=>{ delete state.done[current+(i+1)]; });
  save(); render();
});
$("#clear-all").addEventListener("click",()=>{
  if(confirm("Isto apaga TODAS as suas edições (séries, reps, cargas, links) e marcações, voltando ao plano original. Continuar?")){
    state={fields:{},done:{}}; save(); render();
  }
});

/* ==================== SINCRONIZAÇÃO COM GOOGLE DRIVE ==================== */
let accessToken=null, driveFileId=null, tokenClient=null, syncTimer=null;
const statusEl=$("#sync-status"), signinBtn=$("#g-signin"), signoutBtn=$("#g-signout");

function setSync(kind,text){ statusEl.className="status "+kind; statusEl.innerHTML=`<span class="dot"></span>${text}`; }
const gisReady=()=>typeof google!=="undefined" && google.accounts && google.accounts.oauth2;
const configured=()=>CLIENT_ID.includes(".apps.googleusercontent.com") && !CLIENT_ID.startsWith("COLE_AQUI");

function initAuth(tries){
  tries=tries||0;
  if(!configured()){ setSync("local","Salvo neste dispositivo · configure o Client ID p/ sincronizar"); signinBtn.disabled=true; return; }
  if(!gisReady()){ if(tries<20) return setTimeout(()=>initAuth(tries+1),300); setSync("local","Salvo neste dispositivo"); return; }
  try{
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID, scope:SCOPE,
      callback:resp=>{ if(resp&&resp.access_token){ accessToken=resp.access_token; onSignedIn(); } }
    });
    setSync("local","Salvo neste dispositivo · entre para sincronizar");
  }catch(e){ setSync("local","Salvo neste dispositivo"); }
}
signinBtn.addEventListener("click",()=>{ if(tokenClient) tokenClient.requestAccessToken({prompt:accessToken?"":"consent"}); });
signoutBtn.addEventListener("click",()=>{
  if(accessToken && gisReady()) google.accounts.oauth2.revoke(accessToken,()=>{});
  accessToken=null; driveFileId=null;
  signinBtn.hidden=false; signoutBtn.hidden=true;
  setSync("local","Salvo neste dispositivo");
});

async function onSignedIn(){
  signinBtn.hidden=true; signoutBtn.hidden=false;
  setSync("syncing","Sincronizando…");
  try{
    await findFile();
    const remote=driveFileId ? await downloadFile() : null;
    if(remote && remote.fields){
      state.fields=Object.assign({}, state.fields, remote.fields);
      state.done=Object.assign({}, state.done, remote.done||{});
      saveLocal(); render();
    } else {
      await uploadFile();
    }
    setSync("synced","Sincronizado com o Drive");
  }catch(e){ setSync("error","Erro ao sincronizar"); }
}
async function findFile(){
  const q=encodeURIComponent(`name='${FILE_NAME}'`);
  const r=await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=${q}`,{headers:{Authorization:"Bearer "+accessToken}});
  if(!r.ok) throw new Error("find"); const j=await r.json();
  driveFileId=(j.files&&j.files[0])?j.files[0].id:null;
}
async function downloadFile(){
  const r=await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,{headers:{Authorization:"Bearer "+accessToken}});
  if(!r.ok) return null; return await r.json();
}
async function uploadFile(){
  const boundary="treino"+Date.now();
  const meta={name:FILE_NAME,parents:["appDataFolder"]};
  const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(state)}\r\n--${boundary}--`;
  const r=await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{
    method:"POST",headers:{Authorization:"Bearer "+accessToken,"Content-Type":"multipart/related; boundary="+boundary},body});
  if(!r.ok) throw new Error("upload"); driveFileId=(await r.json()).id;
}
async function updateFile(){
  const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`,{
    method:"PATCH",headers:{Authorization:"Bearer "+accessToken,"Content-Type":"application/json"},body:JSON.stringify(state)});
  if(!r.ok) throw new Error("update");
}
function syncUp(){
  if(!accessToken) return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    setSync("syncing","Sincronizando…");
    try{ driveFileId ? await updateFile() : await uploadFile(); setSync("synced","Sincronizado com o Drive"); }
    catch(e){ setSync("error","Erro ao sincronizar · entre novamente"); }
  },800);
}

render();
initAuth();
</script>
